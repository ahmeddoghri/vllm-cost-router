name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Run benchmark
        run: python -m app.eval

  routing-quality:
    # Cost is not the only thing that can regress. This fails the build if the
    # router starts sending genuinely complex requests to the cheap tier,
    # which is a quality regression no cost metric would surface.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Measure routing quality
        run: |
          python -m app.routereport
          python - <<'EOF'
          from app import routebench as rb
          from app.router_v2 import complexity_score

          scorer = lambda p: complexity_score(p, 256)
          holdout = rb.score_router(scorer, rb.split("holdout"), 0.10)
          adversarial = rb.score_router(scorer, rb.split("adversarial"), 0.10)

          assert adversarial.misroute_rate == 0.0, adversarial.to_dict()
          assert holdout.misroute_rate <= 0.10, holdout.to_dict()
          assert holdout.overspend_rate == 0.0, holdout.to_dict()
          print("routing quality holds:", holdout.to_dict())
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vllm-cost-router:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name router -p 8000:8000 vllm-cost-router:ci
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8000/healthz
          curl -sf -X POST http://localhost:8000/v1/completions \
            -H "Content-Type: application/json" \
            -d '{"prompt": "hello"}'
          docker logs router
          docker stop router
